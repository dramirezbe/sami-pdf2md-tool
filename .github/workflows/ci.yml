name: CI

on:
  push:
    branches: [main, "refactor/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (light deps, no ML stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/sync_version.py --tag "$GITHUB_REF_NAME"
          fi
          python3 scripts/sync_version.py --sync
          git diff --exit-code -- ui/package.json ui/package-lock.json packaging/runtime-manifest.json packaging/linux/cli-install.sh packaging/windows/cli-install.ps1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light test dependencies
        # The suite mocks the heavy ML stack (marker-pdf / torch / surya),
        # so CI installs only the light deps the fast engine and tests need.
        # This keeps CI fast and deterministic; the full engine is validated
        # separately by the curl install on a real host.
        run: pip install pytest pdfplumber beautifulsoup4 "pymupdf==2.1" "pdftext==0.7.1" "psutil>=5.9" "PyYAML>=6.0"

      - name: Run test suite
        run: python -m pytest tests/ -q

  build:
    name: Build wheel (packaging check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify entry point metadata and version consistency
        run: |
          python -c "import tomllib; \
            from importlib.metadata import version; \
            d=tomllib.load(open('pyproject.toml','rb')); \
            assert 'version' in d['project'].get('dynamic', []), 'version must be dynamic (setuptools-scm)'; \
            v=version('sami-pdf2md-tool'); \
            assert d['project']['scripts']['sami']=='sami.cli:main'; \
            print('packaging OK, version', v)"

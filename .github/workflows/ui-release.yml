name: SAMI desktop release

on:
  pull_request:
    branches: [main]
    paths: ['ui/**', 'packaging/**', 'install.sh', 'install.ps1', '.github/workflows/ui-release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(python3 scripts/sync_version.py)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/sync_version.py --tag "$GITHUB_REF_NAME"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          python3 scripts/sync_version.py --sync
          git diff --exit-code -- ui/package.json ui/package-lock.json packaging/runtime-manifest.json packaging/linux/cli-install.sh packaging/windows/cli-install.ps1

  build-wheel:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the wheel shared by all platforms
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python -m pip install build "setuptools-scm>=8"
          SETUPTOOLS_SCM_PRETEND_VERSION="$RELEASE_VERSION" python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/sami_pdf2md_tool-*.whl
          if-no-files-found: error

  package:
    needs: [resolve-version, build-wheel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            package_script: package:win
          - os: ubuntu-24.04
            target: linux
            package_script: package:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Stamp version from tag
        shell: bash
        run: |
          set -euo pipefail
          V="$RELEASE_VERSION"

          # 1. Sync UI package.json
          npm version "$V" --no-git-tag-version --allow-same-version

          # 2. Use the same wheel for Windows, Linux, and the release.
          cd ..
          WHEEL="sami_pdf2md_tool-${V}-py3-none-any.whl"
          if command -v sha256sum >/dev/null; then
            SHA=$(sha256sum "dist/$WHEEL" | cut -d' ' -f1)
          else
            SHA=$(shasum -a 256 "dist/$WHEEL" | cut -d' ' -f1)
          fi

          # 3. Patch packaging scripts
          sed -i "s/^CLI_VERSION=.*/CLI_VERSION=$V/"                       packaging/linux/cli-install.sh
          sed -i "s/^CLI_WHEEL=.*/CLI_WHEEL=$WHEEL/"                      packaging/linux/cli-install.sh
          sed -i "s/^CLI_SHA256=.*/CLI_SHA256=$SHA/"                       packaging/linux/cli-install.sh
          sed -i "s/^UI_VERSION=.*/UI_VERSION=$V/"                         packaging/linux/cli-install.sh

          sed -i "s/^\\\$cliVersion = .*/\\\$cliVersion = '$V'/"          packaging/windows/cli-install.ps1
          sed -i "s/^\\\$wheelName = .*/\\\$wheelName = 'sami_pdf2md_tool-${V}-py3-none-any.whl'/" packaging/windows/cli-install.ps1
          sed -i "s/^\\\$wheelSha256 = .*/\\\$wheelSha256 = '$SHA'/"      packaging/windows/cli-install.ps1

          # 4. Patch runtime-manifest.json
          python -c "
          import json, sys
          v = sys.argv[1]; sha = sys.argv[2]; tag = f'v{v}'
          with open('packaging/runtime-manifest.json') as f: m = json.load(f)
          m['sami_version'] = v
          m['cli']['version'] = v
          m['cli']['wheel'] = f'sami_pdf2md_tool-{v}-py3-none-any.whl'
          m['cli']['url'] = f'https://github.com/dramirezbe/sami-pdf2md-tool/releases/download/{tag}/sami_pdf2md_tool-{v}-py3-none-any.whl'
          m['cli']['sha256'] = sha
          m['ui']['version'] = v
          m['ui']['release_tag'] = tag
          for plat in ('windows_x64', 'linux_x64'):
              if plat not in m['ui']: continue
              p = m['ui'][plat]
              for key in list(p):
                  if 'asset' in key.lower():
                      old = p[key]
                      import re
                      p[key] = re.sub(r'SAMI-[0-9]+\.[0-9]+\.[0-9]+', f'SAMI-{v}', old)
                  if 'url' in key.lower():
                      old = p[key]
                      import re
                      p[key] = re.sub(r'/v[0-9]+\.[0-9]+\.[0-9]+/', f'/{tag}/', old)
                      p[key] = re.sub(r'SAMI-[0-9]+\.[0-9]+\.[0-9]+', f'SAMI-{v}', p[key])
          with open('packaging/runtime-manifest.json', 'w') as f: json.dump(m, f, indent=2)
          " "$V" "$SHA"

          # Store wheel path for upload
          echo "WHEEL_PATH=dist/$WHEEL" >> "$GITHUB_ENV"
          echo "WHEEL_NAME=$WHEEL" >> "$GITHUB_ENV"
          echo "WHEEL_SHA=$SHA" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Check desktop release and CLI identities
        shell: bash
        env:
          APP_PLATFORM: ${{ matrix.target }}
        run: >
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { CLI_VERSION, PROTOCOL_VERSION } from "./src/cli-runner.js";
          const manifest = JSON.parse(readFileSync("../packaging/runtime-manifest.json", "utf8"));
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          const platform = process.env.APP_PLATFORM === "win" ? "windows_x64" : "linux_x64";
          if (version !== manifest.ui.version || `v${version}` !== manifest.ui.release_tag ||
              CLI_VERSION !== manifest.cli.version || PROTOCOL_VERSION !== manifest.cli.protocol_version ||
              PROTOCOL_VERSION !== manifest.ui.protocol_version || !manifest.ui[platform].asset.includes(version)) {
            console.error({ version, CLI_VERSION, manifest_ui: manifest.ui.version, manifest_cli: manifest.cli.version });
            throw new Error("UI package, CLI protocol, and release manifest versions must match their declared identities.");
          }'
      - run: npm test
      - run: npm run build

      - name: Desktop workflow tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:desktop
          else
            npm run test:desktop
          fi

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: npm run ${{ matrix.package_script }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.package_script }}

      - name: Verify Windows installer wheel and failure log
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Resolve-Path "../dist/sami_pdf2md_tool-$env:RELEASE_VERSION-py3-none-any.whl").Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant()
          $helper = Get-Content -Raw 'release/win-unpacked/resources/cli-install.ps1'
          $manifest = Get-Content -Raw 'release/win-unpacked/resources/runtime-manifest.json' | ConvertFrom-Json
          if (-not $helper.Contains("`$wheelSha256 = '$sha'") -or $manifest.cli.sha256 -ne $sha) {
            throw 'Windows installer does not reference the published wheel checksum.'
          }
          & ../tests/test_windows_install_logging.ps1
          & ../tests/test_windows_release_helper.ps1

      - name: Smoke test AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          APPIMAGE=$(ls release/SAMI-*-linux-x64.AppImage 2>/dev/null | head -1)
          chmod +x "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$APPIMAGE" --no-sandbox --smoke-test

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Resolve-Path 'release/win-unpacked/SAMI.exe').Path
          if (-not (Test-Path $app)) { throw "Installed executable not found: $app" }
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($process.ExitCode)." }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-x64
          path: |
            ui/release/SAMI-*-win-x64-setup.exe
            ui/release/SAMI-*-linux-x64.AppImage
            ui/release/SAMI-*-linux-x64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload stamped packaging files
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: stamped-packaging
          path: |
            packaging/runtime-manifest.json
            packaging/linux/cli-install.sh
            packaging/windows/cli-install.ps1
            install.ps1

  draft-release:
    needs: [resolve-version, package]
    if: needs.resolve-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*-x64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: stamped-packaging
          path: stamped
      - name: Assemble release assets and checksums
        run: |
          V="$RELEASE_VERSION"
          cp stamped/packaging/runtime-manifest.json release-assets/
          cp stamped/install.ps1 release-assets/
          cp install.sh release-assets/
          cp ui/assets/icons/sami-icon-512.png release-assets/
          cp stamped/packaging/linux/cli-install.sh release-assets/cli-install-linux.sh
          cp stamped/packaging/windows/cli-install.ps1 release-assets/cli-install-windows.ps1
          cd release-assets
          sha256sum SAMI-* sami_pdf2md_tool-* runtime-manifest.json install.sh install.ps1 \
            cli-install-linux.sh cli-install-windows.ps1 sami-icon-512.png > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: SAMI ${{ env.RELEASE_VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/SAMI-*-win-x64-setup.exe
            release-assets/SAMI-*-linux-x64.AppImage
            release-assets/SAMI-*-linux-x64.deb
            release-assets/sami_pdf2md_tool-*-py3-none-any.whl
            release-assets/runtime-manifest.json
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/cli-install-linux.sh
            release-assets/cli-install-windows.ps1
            release-assets/sami-icon-512.png
            release-assets/SHA256SUMS
